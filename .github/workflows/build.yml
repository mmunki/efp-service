name: build

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build, test and package
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          bash tests/verify.sh
          bash make-module.sh .build-tests/services-guard.jar "${GITHUB_REF_NAME:-0.4.0}"

      - name: Checksums
        run: |
          sha256sum .build-tests/services-guard.jar dist/*.zip | tee SHA256SUMS

      - name: Upload the boot-safe module
        uses: actions/upload-artifact@v4
        with:
          name: module
          path: |
            dist/*.zip
            SHA256SUMS

      - name: Upload the standalone guard jar
        uses: actions/upload-artifact@v4
        with:
          name: services-guard
          path: .build-tests/services-guard.jar
